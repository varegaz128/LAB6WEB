<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Workshop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="judul">Pendaftaran Workshop</h1>
    <p id="pesan">Silakan isi formulir di bawah ini.</p>

    <!-- Form Pendaftaran Workshop -->
    <form id="formPendaftaran">
        <div>
            <label for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" placeholder="Masukkan nama...">
        </div>
        
        <div>
            <label for="email">Email:</label>
            <input type="text" id="email" placeholder="contoh@email.com">
        </div>
        
        <div>
            <label for="usia">Usia:</label>
            <input type="number" id="usia" placeholder="17-100">
        </div>

        <!-- Tambahan Pilihan Sesi Workshop -->
        <div>
            <label for="sesi">Pilihan Sesi:</label>
            <select id="sesi">
                <option value="">-- Pilih Sesi Workshop --</option>
                <option value="Sesi 1">Sesi 1: Pagi (09:00 - 12:00)</option>
                <option value="Sesi 2">Sesi 2: Siang (13:00 - 16:00)</option>
            </select>
        </div>
        
        <button type="submit">Daftar</button>
        <button type="reset" id="tombolReset">Reset</button>
    </form>
    <p id="pesanForm" aria-live="polite"></p>
    <br>

    <!-- Penghitung Karakter Live -->
    <div>
        <label for="namaInput">Cek Jumlah Karakter Nama:</label>
        <input type="text" id="namaInput">
        <p id="jumlahKarakter">Jumlah karakter: 0</p>
    </div>
    <br>

    <!-- Aplikasi Daftar Tugas (To-Do List Pendukung) -->
    <section>
        <h2>Daftar Tugas</h2>
        <label for="inputTugas">Tugas baru</label>
        <input id="inputTugas" type="text">
        <button id="tambahTugas" type="button">Tambah</button>
        <p id="pesanTugas" aria-live="polite"></p>
        <ul id="daftarTugas"></ul>
    </section>

    <script src="script.js"></script>
</body>
</html>
